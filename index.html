<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ETHUSDT | Binance Realtime</title>
    <link id="favicon" rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            padding: 0.75rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            gap: 0.5rem;
        }
        .left-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .symbol {
            color: #f8fafc;
            font-size: 1.2rem;
            font-weight: 700;
        }
        .stats-bar {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        .stat-value {
            font-weight: 600;
            color: #f8fafc;
        }
        .timeframe-selector {
            display: flex;
            background: #181e29;
            padding: 3px;
            border-radius: 8px;
            gap: 2px;
        }
        .tf-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tf-btn:hover { color: #f8fafc; background: rgba(255, 255, 255, 0.05); }
        .tf-btn.active { background: #38bdf8; color: #0f172a; }
        
        .price {
            font-size: 1.6rem;
            font-weight: 700;
            color: #38bdf8;
            font-variant-numeric: tabular-nums;
            padding: 4px 8px;
            border-radius: 8px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        
        .flash-up {
            color: #ffffff !important;
            background-color: #16a34a !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
            transform: scale(1.03);
        }
        .flash-down {
            color: #ffffff !important;
            background-color: #dc2626 !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
            transform: scale(1.03);
        }

        #chart-wrapper { 
            flex: 1; 
            width: 100%; 
            position: relative;
            min-height: 0; /* Quan trọng cho layout flexbox trên mobile */
        }
        #chart { width: 100%; height: 100%; }
        .status { padding-top: 0.3rem; font-size: 0.75rem; color: #22c55e; text-align: right; }

        /* Tối ưu riêng cho màn hình Điện thoại (Responsive CSS) */
        @media (max-width: 600px) {
            .container { padding: 0.5rem; }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.4rem;
            }
            .header-top {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }
            .left-header {
                gap: 0.6rem;
                width: 100%;
                justify-content: space-between;
            }
            .symbol { font-size: 1.1rem; }
            .price { font-size: 1.5rem; padding: 2px 6px; }
            .stats-bar {
                width: 100%;
                justify-content: space-between;
                font-size: 0.75rem;
                background: rgba(255, 255, 255, 0.03);
                padding: 4px 8px;
                border-radius: 6px;
            }
            .stat-item {
                flex-direction: row;
                gap: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-top">
                <div class="symbol">ETHUSDT</div>
                <div id="price" class="price">Connecting...</div>
            </div>
            <div class="left-header">
                <div class="timeframe-selector">
                    <button class="tf-btn" data-interval="1h">1H</button>
                    <button class="tf-btn active" data-interval="4h">4H</button>
                    <button class="tf-btn" data-interval="1d">1D</button>
                </div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <span>24h:</span>
                        <span id="change-24h" class="stat-value">--</span>
                    </div>
                    <div class="stat-item">
                        <span>Cao:</span>
                        <span id="high-24h" class="stat-value">--</span>
                    </div>
                    <div class="stat-item">
                        <span>Thấp:</span>
                        <span id="low-24h" class="stat-value">--</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="chart-wrapper">
            <div id="chart"></div>
        </div>
        <div class="status" id="status-text">● Connecting...</div>
    </div>

    <script>
        const priceElement = document.getElementById('price');
        const chartWrapper = document.getElementById('chart-wrapper');
        const chartContainer = document.getElementById('chart');
        const statusElement = document.getElementById('status-text');
        const faviconElement = document.getElementById('favicon');

        let ws = null;
        let lastPrice = 0;
        let latestCandle = null;
        let currentInterval = '4h';
        let flashTimeout = null;
        
        let isFetchingHistory = false;
        let earliestTimestamp = null;
        let allCandles = [];

        const faviconCanvas = document.createElement('canvas');
        faviconCanvas.width = 32; faviconCanvas.height = 32;
        const favCtx = faviconCanvas.getContext('2d');

        function updateFavicon(isUp) {
            favCtx.clearRect(0, 0, 32, 32);
            favCtx.fillStyle = '#0f172a';
            favCtx.beginPath(); favCtx.arc(16, 16, 16, 0, 2 * Math.PI); favCtx.fill();
            favCtx.fillStyle = isUp ? '#22c55e' : '#ef4444';
            favCtx.beginPath(); favCtx.arc(16, 16, 10, 0, 2 * Math.PI); favCtx.fill();
            faviconElement.href = faviconCanvas.toDataURL('image/png');
        }

        // Tự động nhận diện màn hình nhỏ để thu gọn lề cho mobile
        const isMobile = window.innerWidth <= 600;

        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartWrapper.clientWidth,
            height: chartWrapper.clientHeight,
            layout: { backgroundColor: '#0b0e14', textColor: '#94a3b8' },
            grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
            timeScale: { 
                timeVisible: true, 
                secondsVisible: false,
                rightOffset: isMobile ? 6 : 12,
                barSpacing: isMobile ? 10 : 15
            },
            rightPriceScale: { autoScale: true }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#22c55e', downColor: '#ef4444',
            borderVisible: false, wickUpColor: '#22c55e', wickDownColor: '#ef4444',
        });

        async function loadInitialData(interval) {
            try {
                isFetchingHistory = true;
                const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=ETHUSDT&interval=${interval}&limit=500`);
                const data = await res.json();
                
                allCandles = data.map(d => ({
                    time: Math.floor(d[0] / 1000),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4]),
                }));

                candlestickSeries.setData(allCandles);

                if (allCandles.length > 0) {
                    const totalBars = allCandles.length;
                    const visibleBars = isMobile ? 22 : 30; // Mobile hiển thị 22 nến cho vừa tầm mắt
                    chart.timeScale().setVisibleLogicalRange({
                        from: totalBars - visibleBars,
                        to: totalBars + 3
                    });

                    earliestTimestamp = allCandles[0].time;
                    latestCandle = { ...allCandles[allCandles.length - 1] };
                    lastPrice = latestCandle.close;
                    updatePriceUI(lastPrice);
                }
                isFetchingHistory = false;
            } catch (err) {
                console.error("API Error:", err);
                isFetchingHistory = false;
            }

            fetch24hTicker();
            connectBinanceWebStream(interval);
        }

        chart.timeScale().subscribeVisibleLogicalRangeChange(async (newRange) => {
            if (newRange && newRange.from < 10 && !isFetchingHistory && earliestTimestamp) {
                isFetchingHistory = true;
                try {
                    const endTimeMs = earliestTimestamp * 1000 - 1;
                    const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=ETHUSDT&interval=${currentInterval}&endTime=${endTimeMs}&limit=300`);
                    const olderData = await res.json();

                    if (olderData.length > 0) {
                        const olderCandles = olderData.map(d => ({
                            time: Math.floor(d[0] / 1000),
                            open: parseFloat(d[1]),
                            high: parseFloat(d[2]),
                            low: parseFloat(d[3]),
                            close: parseFloat(d[4]),
                        }));

                        earliestTimestamp = olderCandles[0].time;
                        allCandles = [...olderCandles, ...allCandles];
                        candlestickSeries.setData(allCandles);
                    }
                } catch (err) {
                    console.error("Lỗi tải nến cũ:", err);
                }
                isFetchingHistory = false;
            }
        });

        async function fetch24hTicker() {
            try {
                const res = await fetch(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=ETHUSDT`);
                const data = await res.json();
                
                const change = parseFloat(data.priceChangePercent);
                const changeEl = document.getElementById('change-24h');
                changeEl.innerText = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
                changeEl.style.color = change >= 0 ? '#22c55e' : '#ef4444';

                document.getElementById('high-24h').innerText = `$${parseFloat(data.highPrice).toFixed(1)}`;
                document.getElementById('low-24h').innerText = `$${parseFloat(data.lowPrice).toFixed(1)}`;
            } catch(e) {}
        }

        function connectBinanceWebStream(interval) {
            if (ws) ws.close();

            const streamUrl = `wss://fstream.binance.com/stream?streams=ethusdt@bookTicker/ethusdt@kline_${interval}/ethusdt@ticker`;
            ws = new WebSocket(streamUrl);

            ws.onopen = () => {
                statusElement.innerText = `● Streaming (${interval.toUpperCase()})`;
                statusElement.style.color = '#22c55e';
            };

            ws.onmessage = (event) => {
                const response = JSON.parse(event.data);
                if (!response.data) return;

                const data = response.data;

                if (data.b || data.a) {
                    const price = parseFloat(data.b); 
                    if (price && price !== lastPrice) {
                        updatePriceUI(price);
                        if (latestCandle) {
                            latestCandle.close = price;
                            if (price > latestCandle.high) latestCandle.high = price;
                            if (price < latestCandle.low) latestCandle.low = price;
                            candlestickSeries.update(latestCandle);
                        }
                    }
                }

                if (data.k) {
                    const k = data.k;
                    latestCandle = {
                        time: Math.floor(k.t / 1000),
                        open: parseFloat(k.o),
                        high: parseFloat(k.h),
                        low: parseFloat(k.l),
                        close: parseFloat(k.c),
                    };
                    candlestickSeries.update(latestCandle);
                }

                if (data.P) {
                    const change = parseFloat(data.P);
                    const changeEl = document.getElementById('change-24h');
                    changeEl.innerText = `${change >= 0 ? '+' : ''}${change.toFixed(2)}%`;
                    changeEl.style.color = change >= 0 ? '#22c55e' : '#ef4444';
                    document.getElementById('high-24h').innerText = `$${parseFloat(data.h).toFixed(1)}`;
                    document.getElementById('low-24h').innerText = `$${parseFloat(data.l).toFixed(1)}`;
                }
            };

            ws.onclose = () => { statusElement.innerText = '🔄 Reconnecting...'; statusElement.style.color = '#eab308'; };
        }

        function updatePriceUI(price) {
            const formattedPrice = price.toLocaleString('en-US', {
                style: 'currency', currency: 'USD', minimumFractionDigits: 2
            });

            priceElement.innerText = formattedPrice;

            if (lastPrice !== 0 && price !== lastPrice) {
                const isUp = price > lastPrice;

                document.title = `${formattedPrice} ${isUp ? '🟢' : '🔴'} | ETHUSDT`;
                updateFavicon(isUp);

                clearTimeout(flashTimeout);
                priceElement.classList.remove('flash-up', 'flash-down');
                void priceElement.offsetWidth;

                priceElement.classList.add(isUp ? 'flash-up' : 'flash-down');

                flashTimeout = setTimeout(() => {
                    priceElement.classList.remove('flash-up', 'flash-down');
                    priceElement.style.color = isUp ? '#22c55e' : '#ef4444';
                    priceElement.style.backgroundColor = 'transparent';
                    priceElement.style.boxShadow = 'none';
                    priceElement.style.transform = 'scale(1)';
                }, 200);
            }

            lastPrice = price;
        }

        document.querySelectorAll('.tf-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentInterval = e.target.getAttribute('data-interval');
                loadInitialData(currentInterval);
            });
        });

        loadInitialData(currentInterval);

        // Tự động căn chỉnh chuẩn khi xoay ngang/dọc điện thoại
        window.addEventListener('resize', () => {
            chart.applyOptions({
                width: chartWrapper.clientWidth,
                height: chartWrapper.clientHeight
            });
        });
    </script>
</body>
</html>
