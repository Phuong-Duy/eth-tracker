<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Đồ Nến ETH/USDT Real-time</title>
    <!-- Nhúng thư viện Lightweight Charts từ TradingView -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .symbol {
            color: #94a3b8;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .price {
            font-size: 2rem;
            font-weight: 700;
            color: #38bdf8;
            transition: color 0.3s;
        }
        #chart {
            width: 100%;
            height: 450px;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #22c55e;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="symbol">ETH / USDT (Nến 1m)</div>
            <div id="price" class="price">Đang kết nối...</div>
        </div>
        
        <!-- Khung chứa biểu đồ -->
        <div id="chart"></div>
        
        <div class="status">● Real-time (Binance Kline Stream)</div>
    </div>

    <script>
        const priceElement = document.getElementById('price');
        const chartContainer = document.getElementById('chart');

        // 1. Khởi tạo biểu đồ Lightweight Charts
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                backgroundColor: '#1e293b',
                textColor: '#94a3b8',
            },
            grid: {
                vertLines: { color: '#334155' },
                horzLines: { color: '#334155' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
        });

        // 2. Thêm series Nến (Candlestick)
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#22c55e',
            downColor: '#ef4444',
            borderVisible: false,
            wickUpColor: '#22c55e',
            wickDownColor: '#ef4444',
        });

        // Tải dữ liệu lịch sử ban đầu từ REST API Binance để vẽ ngay nến cũ
        async function fetchHistory() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/klines?symbol=ETHUSDT&interval=1m&limit=100');
                const data = await response.json();
                
                const historyCandles = data.map(d => ({
                    time: d[0] / 1000,
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4]),
                }));

                candlestickSeries.setData(historyCandles);
            } catch (err) {
                console.error('Không thể tải dữ liệu lịch sử:', err);
            }
        }

        fetchHistory();

        // 3. Kết nối WebSocket Binance Stream Nến 1 phút (ethusdt@kline_1m)
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/ethusdt@kline_1m');
        let lastPrice = 0;

        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            const kline = message.k;

            // Đóng gói dữ liệu nến cho thư viện
            const candleData = {
                time: kline.t / 1000, // Unix timestamp (giây)
                open: parseFloat(kline.o),
                high: parseFloat(kline.h),
                low: parseFloat(kline.l),
                close: parseFloat(kline.c),
            };

            // Cập nhật nến hiện tại hoặc tạo nến mới trên biểu đồ
            candlestickSeries.update(candleData);

            // Hiển thị giá hiện tại
            const currentPrice = candleData.close;
            priceElement.innerText = currentPrice.toLocaleString('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2
            });

            if (lastPrice !== 0) {
                priceElement.style.color = currentPrice >= lastPrice ? '#22c55e' : '#ef4444';
            }
            lastPrice = currentPrice;
        };

        ws.onerror = () => {
            priceElement.innerText = 'Lỗi kết nối';
            priceElement.style.color = '#ef4444';
        };

        // Tự động căn chỉnh kích thước biểu đồ khi đổi cỡ màn hình
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth });
        });
    </script>
</body>
</html>
