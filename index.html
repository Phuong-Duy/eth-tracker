<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETH/USDT Real-time Chart</title>
    <!-- Lightweight Charts v3.8.0 -->
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .symbol {
            color: #94a3b8;
            font-size: 1.2rem;
            font-weight: 600;
        }
        .price {
            font-size: 2rem;
            font-weight: 700;
            color: #38bdf8;
            transition: color 0.1s ease-in-out;
        }
        #chart {
            width: 100%;
            height: 450px;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #22c55e;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="symbol">ETHUSDT PERP (Futures 1m)</div>
            <div id="price" class="price">Connecting...</div>
        </div>
        
        <div id="chart"></div>
        
        <div class="status" id="status-text">● Live High-Speed Stream</div>
    </div>

    <script>
        const priceElement = document.getElementById('price');
        const chartContainer = document.getElementById('chart');
        const statusElement = document.getElementById('status-text');

        // Initialize Chart Instance
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                backgroundColor: '#1e293b',
                textColor: '#94a3b8',
            },
            grid: {
                vertLines: { color: '#334155' },
                horzLines: { color: '#334155' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#22c55e',
            downColor: '#ef4444',
            borderVisible: false,
            wickUpColor: '#22c55e',
            wickDownColor: '#ef4444',
        });

        let currentCandle = null;
        let lastPrice = 0;

        // 1. Fetch History
        async function initChart() {
            try {
                const response = await fetch('https://fapi.binance.com/fapi/v1/klines?symbol=ETHUSDT&interval=1m&limit=150');
                if (response.ok) {
                    const data = await response.json();
                    const historyCandles = data.map(d => ({
                        time: d[0] / 1000,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4]),
                    }));
                    
                    candlestickSeries.setData(historyCandles);
                    currentCandle = { ...historyCandles[historyCandles.length - 1] };
                    lastPrice = currentCandle.close;
                    
                    priceElement.innerText = lastPrice.toLocaleString('en-US', {
                        style: 'currency',
                        currency: 'USD',
                        minimumFractionDigits: 2
                    });
                }
            } catch (err) {
                console.warn('History load failed, connecting live stream...', err);
            }

            connectTradeStream();
        }

        // 2. High-Speed Combined WebSocket Stream (Kline + Instant Trade)
        function connectTradeStream() {
            // Subscribe to both 1m Kline and Combined Trades
            const ws = new WebSocket('wss://fstream.binance.com/stream?streams=ethusdt@kline_1m/ethusdt@aggTrade');

            ws.onopen = () => {
                statusElement.innerText = '● Real-time Live (Binance Futures Stream)';
                statusElement.style.color = '#22c55e';
            };

            ws.onmessage = (event) => {
                const response = JSON.parse(event.data);
                const stream = response.stream;
                const data = response.data;

                // Sync Official Kline Data
                if (stream.includes('@kline')) {
                    const kline = data.k;
                    currentCandle = {
                        time: kline.t / 1000,
                        open: parseFloat(kline.o),
                        high: parseFloat(kline.h),
                        low: parseFloat(kline.l),
                        close: parseFloat(kline.c),
                    };
                    candlestickSeries.update(currentCandle);
                }

                // High-Speed Price Tick (Milliseconds Update)
                if (stream.includes('@aggTrade')) {
                    const currentPrice = parseFloat(data.p);

                    // Update Price Text Instantly
                    priceElement.innerText = currentPrice.toLocaleString('en-US', {
                        style: 'currency',
                        currency: 'USD',
                        minimumFractionDigits: 2
                    });

                    // Color indicator on every single trade
                    if (lastPrice !== 0) {
                        priceElement.style.color = currentPrice >= lastPrice ? '#22c55e' : '#ef4444';
                    }
                    lastPrice = currentPrice;

                    // Update current candle high, low, close in real-time
                    if (currentCandle) {
                        currentCandle.close = currentPrice;
                        if (currentPrice > currentCandle.high) currentCandle.high = currentPrice;
                        if (currentPrice < currentCandle.low) currentCandle.low = currentPrice;
                        candlestickSeries.update(currentCandle);
                    }
                }
            };

            ws.onerror = () => {
                statusElement.innerText = '● Stream Error';
                statusElement.style.color = '#ef4444';
            };

            ws.onclose = () => {
                statusElement.innerText = '● Reconnecting...';
                statusElement.style.color = '#eab308';
                setTimeout(connectTradeStream, 3000);
            };
        }

        initChart();

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth });
        });
    </script>
</body>
</html>
